const RULES=[

const COUNT={campañas:['campaigns','campagnes'],campaña:['campaign','campagne'],contenidos:['content items','contenus'],contenido:['content item','contenu'],eventos:['events','événements'],evento:['event','événement'],

  'tareas vencidas':['overdue tasks','tâches en retard'],abiertas:['open','ouvertes'],bloqueadas:['blocked','bloquées'],vencidas:['overdue','en retard'],pendientes:['pending','en attente'],resultados:['results','résultats'],
  ideas:['ideas','idées'],idea:['idea','idée'],plantillas:['templates','modèles'],pilares:['pillars','piliers'],tipos:['types','types'],'tipos de contenido':['content types','types de contenu'],enlaces:['links','liens'],piezas:['pieces','pièces'],
  comunicaciones:['communications','communications'],comentarios:['comments','commentaires'],comentario:['comment','commentaire'],'car.':['chars','car.'],caracteres:['characters','caractères'],subtareas:['subtasks','sous-tâches'],
  'contenidos guardados':['saved content items','contenus enregistrés'],cont:['items','cont.'],'cont.':['items','cont.'],'ev.':['ev.','év.'],'imágenes':['images','images'],emails:['emails','e-mails'],
  '€ presupuestados':['€ budgeted','€ budgétés'],'personas':['people','personnes'],'superadmins activos':['active superadmins','superadmins actifs']};
const KEEP=new Set(['SCRIPT','STYLE','TEXTAREA','CODE','PRE','TITLE']);
let lang='es';try{lang=localStorage.getItem('pp_lang')||'es'}catch(e){}
if(!['es','en','fr'].includes(lang))lang='es';
const li=()=>lang==='en'?0:1;

function trPiece(p){const t=p.replace(/\s+/g,' ').trim();if(!t)return p;let r=null;
  if(D[t])r=D[t][lang];
  else{let m;
    if((m=t.match(/^(\+ )?(\d+(?:[\/.,]\d+)*)\s+(.+)$/))){const w=COUNT[m[3]]||(D[m[3]]&&[D[m[3]].en,D[m[3]].fr]);if(w)r=(m[1]||'')+m[2]+' '+w[li()]}
    if(r==null&&(m=t.match(/^\+ (.+)$/))&&D[m[1]])r='+ '+D[m[1]][lang];
    if(r==null&&(m=t.match(/^\((.+)\)$/))&&D[m[1]])r='('+D[m[1]][lang]+')';
    if(r==null&&(m=t.match(/^(.+?):$/))&&D[m[1]])r=D[m[1]][lang]+(lang==='fr'?' :':':');
    if(r==null&&(m=t.match(/^(.+?)\s+(\d+)$/))&&D[m[1]])r=D[m[1]][lang]+' '+m[2];
    if(r==null)for(const [re,fn] of RULES){const mm=t.match(re);if(mm){const x=fn(mm,lang,tr);if(x!=null){r=x;break}}}}
  if(r==null)return p;
  const lead=p.match(/^\s*/)[0],trail=p.match(/\s*$/)[0];return lead+r+trail}
function tr(s){if(lang==='es')return s;const one=trPiece(s);if(one!==s)return one;
  const parts=s.split(/(\s+·\s+|\s+—\s+|\s+→\s+|\s+–\s+|^·\s+)/);
  if(parts.length>1){let ch=false;const out=parts.map((p,i)=>{if(i%2)return p;const x=trPiece(p);if(x!==p)ch=true;return x});if(ch)return out.join('')}
  return s}

const orig=new WeakMap();const ATTRS=['placeholder','title','aria-label'];
function walkText(root){if(!root)return;
  if(root.nodeType===3){doText(root);return}
  if(root.nodeType!==1||KEEP.has(root.tagName)||root.closest&&root.closest('[data-noi18n]'))return;
  if(root.tagName==='OPTION')fixOption(root);
  ATTRS.forEach(a=>{if(!root.hasAttribute(a))return;const k='data-i18n-'+a;if(!root.hasAttribute(k))root.setAttribute(k,root.getAttribute(a));const o=root.getAttribute(k);root.setAttribute(a,lang==='es'?o:tr(o))});
  root.querySelectorAll('option').forEach(fixOption);
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{let e=n.parentElement;while(e&&e!==root.parentElement){if(KEEP.has(e.tagName)||e.hasAttribute('data-noi18n'))return NodeFilter.FILTER_REJECT;e=e.parentElement}return NodeFilter.FILTER_ACCEPT}});
  const list=[];let n;while(n=tw.nextNode())list.push(n);list.forEach(doText);
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{if(el.closest('[data-noi18n]'))return;ATTRS.forEach(a=>{if(!el.hasAttribute(a))return;const k='data-i18n-'+a;
    if(!el.hasAttribute(k))el.setAttribute(k,el.getAttribute(a));const o=el.getAttribute(k);const v=lang==='es'?o:tr(o);if(el.getAttribute(a)!==v)el.setAttribute(a,v)})})}
function fixOption(o){if(!o.hasAttribute('value'))o.setAttribute('value',o.textContent)}
/* orig guarda {o: texto original en español, w: lo último que escribimos}; si la app cambia el texto, se toma como nuevo original */
function doText(n){const v=n.nodeValue;if(!v||!/[A-Za-zÀ-ÿ]/.test(v))return;let s=orig.get(n);
  if(!s||(v!==s.w)){s={o:v,w:v};orig.set(n,s)}
  const want=lang==='es'?s.o:tr(s.o);if(v!==want){n.nodeValue=want}s.w=want}

let busy=false;
const mo=new MutationObserver(ms=>{if(busy)return;busy=true;try{ms.forEach(m=>m.addedNodes.forEach(walkText))}finally{busy=false}});
function start(){walkText(document.body);mo.observe(document.body,{childList:true,subtree:true});document.documentElement.lang=lang;paintSwitch()}

function paintSwitch(){const el=document.getElementById('langs');if(!el)return;
  el.innerHTML=['es','en','fr'].map(l=>`<button type="button" data-lang="${l}" aria-pressed="${l===lang}" title="${{es:'Español',en:'English',fr:'Français'}[l]}">${l.toUpperCase()}</button>`).join('');}
const binders=[];
const I18N={
  get lang(){return lang},tr,
  bindDates(arrays){binders.push(arrays);applyDates(arrays)},
  setLang(l){if(!['es','en','fr'].includes(l)||l===lang)return;lang=l;try{localStorage.setItem('pp_lang',l)}catch(e){}
    document.documentElement.lang=l;binders.forEach(applyDates);busy=true;try{walkText(document.body)}finally{busy=false}paintSwitch();
    if(typeof window.ppRerender==='function')window.ppRerender()},
  num(n){return Number(n).toLocaleString(lang==='en'?'en-GB':lang==='fr'?'fr-FR':'es-ES')}
};
function applyDates(a){const d=DATES[lang];['MES','DOW','DOWL'].forEach(k=>{if(Array.isArray(a[k]))a[k].splice(0,a[k].length,...d[k])})}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-lang]');if(b){e.stopPropagation();I18N.setLang(b.dataset.lang)}},true);
window.I18N=I18N;
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();

<script>
/* Plataforma Parentes · capa de datos única.
   Toda la persistencia pasa por aquí: la app nunca habla directamente con la base de datos.
   Tres implementaciones con la misma interfaz: Firebase (versión publicada), base de datos del artefacto de claude.ai y localStorage (modo demo).
   Fase 2: se sustituye la implementación por llamadas a google.script.run con la misma interfaz. */
(function(){
const COLS=['schools','events','contents','ideas','tasks','config','campaigns','templates'];
const cache={};COLS.forEach(c=>cache[c]={});
const ready=new Set();
const listeners=new Set();
let backend=null,assets=null,downloads=null,mode='none';
const emit=col=>listeners.forEach(fn=>{try{fn(col)}catch(e){console.error(e)}});
const fail=(code,message)=>{const e=new Error(message||code);e.code=code;return e};
const clone=v=>JSON.parse(JSON.stringify(v));

/* ---- implementación sobre la base de datos del artefacto ---- */
const artifactBackend=db=>({
  newId:col=>db.collection(col).doc().id,
  create:(col,id,data)=>db.collection(col).doc(id).set(data),
  update:(col,id,patch)=>db.doc(col+'/'+id).update(patch),
  remove:(col,id)=>db.doc(col+'/'+id).delete(),
  watch(col){db.collection(col).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});cache[col]=o;ready.add(col);emit(col)},
    e=>{if(Store.onError)Store.onError(e)})}
});


/* ---- implementación sobre Firebase (Firestore) ----
   Cada colegio es un «inquilino»: lo suyo vive en schools/{colegio}/{colección}/{id} para que las reglas de seguridad
   puedan garantizar que nadie vea lo de otro colegio. Los documentos sin colegio van a schools/_global/… (los lee todo el mundo,
   los escribe Parentes). Un documento de varios colegios se guarda en cada uno de ellos (una copia por colegio), para que todos lo vean.
   Fundación Parentes (superadmin) lee con consultas de grupo; el resto, una escucha por cada uno de sus colegios. */
const firebaseBackend=fb=>{
  const {db,fs,profile}=fb;
  const DATA=['events','contents','ideas','tasks','campaigns'];
  const sup=profile.rol==='superadmin';
  const owner={};DATA.forEach(c=>owner[c]={});
  const known={};DATA.forEach(c=>known[c]={});   /* en qué colegios está cada documento (se actualiza con cada cambio, aunque la copia local aún no lo refleje) */
  const part={};DATA.forEach(c=>part[c]={});
  const sidOf=d=>(d&&Array.isArray(d.schools)&&d.schools[0])||'_global';
  const sidsOf=d=>{const a=d&&Array.isArray(d.schools)?[...new Set(d.schools.filter(Boolean))]:[];return a.length?a:['_global']};
  /* varias escrituras: vale si al menos una sale bien (un colaborador no puede escribir en colegios que no son suyos) */
  const some=async ps=>{const r=await Promise.allSettled(ps);if(r.length&&r.every(x=>x.status==='rejected'))throw r[0].reason};
  const path=(col,id,sid)=>DATA.includes(col)?'schools/'+sid+'/'+col+'/'+id:col+'/'+id;
  const plain=o=>JSON.parse(JSON.stringify(o));
  const merge=col=>{const o={};Object.values(part[col]).forEach(m=>Object.assign(o,m));cache[col]=o};
  const err=e=>{if(Store.onError)Store.onError(e)};
  return {
    newId:()=>fs.doc(fs.collection(db,'_ids')).id,
    async create(col,id,data){
      const d=plain(data);
      if(!DATA.includes(col)){await fs.setDoc(fs.doc(db,path(col,id)),d);return}
      const sids=sidsOf(d);owner[col][id]=sids[0];known[col][id]=sids;
      await some(sids.map(sid=>fs.setDoc(fs.doc(db,path(col,id,sid)),d)));
    },
    async update(col,id,patch){
      const p=plain(patch);
      if(!DATA.includes(col)){await fs.updateDoc(fs.doc(db,col+'/'+id),p);return}
      const prev=cache[col][id]||(known[col][id]?{schools:known[col][id].filter(x=>x!=='_global')}:{});
      const before=known[col][id]||sidsOf(prev),merged={...prev,...p},after=sidsOf(merged);
      const ops=[];
      after.forEach(sid=>ops.push(before.includes(sid)?fs.updateDoc(fs.doc(db,path(col,id,sid)),p):fs.setDoc(fs.doc(db,path(col,id,sid)),merged)));
      before.filter(sid=>!after.includes(sid)).forEach(sid=>ops.push(fs.deleteDoc(fs.doc(db,path(col,id,sid)))));
      known[col][id]=after;await some(ops);owner[col][id]=after[0];
    },
    async remove(col,id){
      if(!DATA.includes(col)){await fs.deleteDoc(fs.doc(db,path(col,id)));return}
      const sids=known[col][id]||sidsOf(cache[col][id]||{schools:owner[col][id]?[owner[col][id]]:[]});
      delete known[col][id];
      await some(sids.map(sid=>fs.deleteDoc(fs.doc(db,path(col,id,sid)))));
    },
    watch(col){
      if(!DATA.includes(col)){
        fs.onSnapshot(fs.collection(db,col),snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});cache[col]=o;ready.add(col);emit(col)},e=>{ready.add(col);err(e);emit(col)});
        return;
      }
      if(sup){
        fs.onSnapshot(fs.collectionGroup(db,col),snap=>{
          const o={};snap.docs.forEach(d=>{owner[col][d.id]=d.ref.parent.parent?d.ref.parent.parent.id:'_global';o[d.id]=d.data();known[col][d.id]=sidsOf(d.data())});
          part[col]={all:o};merge(col);ready.add(col);emit(col)},e=>{ready.add(col);err(e);emit(col)});
        return;
      }
      const keys=[...new Set([...(profile.schools||[]),'_global'])];const done=new Set();
      const finish=k=>{done.add(k);if(done.size===keys.length)ready.add(col);emit(col)};
      keys.forEach(k=>fs.onSnapshot(fs.collection(db,'schools/'+k+'/'+col),snap=>{
        const o={};snap.docs.forEach(d=>{owner[col][d.id]=k;o[d.id]=d.data();known[col][d.id]=sidsOf(d.data())});
        part[col][k]=o;merge(col);finish(k)},e=>{err(e);finish(k)}));
    }
  };
};

/* ---- implementación local (vista previa sin claude.ai) ---- */
const LS='pp_demo_';
const localBackend={
  newId:()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
  save(col){try{localStorage.setItem(LS+col,JSON.stringify(cache[col]))}catch(e){}},
  async create(col,id,data){cache[col]={...cache[col],[id]:clone(data)};this.save(col);emit(col)},
  async update(col,id,patch){if(!cache[col][id])throw fail('not_found','No existe');cache[col]={...cache[col],[id]:{...cache[col][id],...clone(patch)}};this.save(col);emit(col)},
  async remove(col,id){const o={...cache[col]};delete o[id];cache[col]=o;this.save(col);emit(col)},
  watch(col){try{cache[col]=JSON.parse(localStorage.getItem(LS+col)||'{}')||{}}catch(e){cache[col]={}}ready.add(col);setTimeout(()=>emit(col),0)}
};

const Store={
  COLS,
  mode:()=>mode,
  async init(opts){
    if(opts&&opts.firebase){backend=firebaseBackend(opts.firebase);mode='firebase';COLS.forEach(col=>backend.watch(col));emit('*');return mode}
    const c=window.claude;let db=null;
    if(c&&c.use){
      c.use('downloads').then(d=>{downloads=d;emit('*')}).catch(()=>{});
      c.use('assets').then(a=>{assets=a;emit('*')}).catch(()=>{});
      try{db=await c.use('db')}catch(e){db=null}
    }
    if(db){backend=artifactBackend(db);mode='artifact'}else{backend=localBackend;mode='local'}
    COLS.forEach(col=>backend.watch(col));
    emit('*');return mode;
  },
  subscribe(fn){listeners.add(fn);return ()=>listeners.delete(fn)},
  isReady:col=>ready.has(col),
  /* lectura (desde la copia en memoria, que se mantiene al día sola) */
  list:col=>cache[col]||{},
  get:(col,id)=>(cache[col]||{})[id],
  /* escritura */
  newId:col=>(backend||localBackend).newId(col),
  create:(col,id,data)=>backend?backend.create(col,id,data):Promise.reject(fail('unavailable')),
  update:(col,id,patch)=>backend?backend.update(col,id,patch):Promise.reject(fail('unavailable')),
  remove:(col,id)=>backend?backend.remove(col,id):Promise.reject(fail('unavailable')),
  /* archivos */
  canUpload:()=>!!assets,
  upload:(file,opts)=>assets?assets.upload(file,opts):Promise.reject(fail('not_granted')),
  deleteFile:id=>assets?assets.delete(id):Promise.reject(fail('not_granted')),
  fileUrl:id=>'/_blob/'+id,
  canDownload:()=>!!downloads||mode==='local'||mode==='firebase',
  async download({filename,data}){
    if(downloads)return downloads.save({filename,data});
    if(mode!=='local'&&mode!=='firebase')throw fail('unavailable');
    const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1000);return {status:'saved'};
  },
  /* solo modo demo: cargar datos de prueba */
  seed(obj){if(mode!=='local')throw fail('only_local');Object.entries(obj).forEach(([col,docs])=>{if(!COLS.includes(col))return;cache[col]=clone(docs);localBackend.save(col);ready.add(col);emit(col)})}
};
window.Store=Store;
})();

.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;align-items:start}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:14px;display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.col h3 .mono{font-size:12px;color:var(--fg-3);font-weight:500}
.task{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start}
.task input{margin-top:3px;width:15px;height:15px;accent-color:var(--accent)}
.task .tt{font-weight:600;font-size:13px;cursor:pointer}
.task.done .tt{text-decoration:line-through;color:var(--fg-3)}
.task .tm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--fg-3);margin-top:3px}
.due{font-family:var(--f-mono);font-size:11px;padding:0 5px;border-radius:3px;background:var(--bg);color:var(--fg-2)}
.due.late{background:var(--bad);color:#fff}
.due.soon{background:var(--warn);color:#fff}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:12px;text-align:left}

/* guide */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.steps{display:grid;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500;padding-top:2px}
.step b{display:block;font-size:13px}
.step span{font-size:13px;color:var(--fg-2)}
.rule{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:10px 12px;font-weight:600;font-size:13px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{font-weight:700}
.kv dd{margin:0;color:var(--fg-2)}
ul.tips{margin:0;padding-left:18px;color:var(--fg-2);font-size:13px;display:grid;gap:3px}
.pillars{display:grid;gap:6px}
.pillars div{font-size:13px}
.pillars b{font-weight:700}
.pillars span{color:var(--fg-2)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,20,25,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(700px,100%);background:var(--panel);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.dh{display:flex;align-items:center;gap:10px;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.dh h2{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db{padding:14px 18px 30px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.df{display:flex;gap:8px;padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.df .sp{flex:1}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec>h3 em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--fg-2);display:inline-flex;align-items:center;gap:5px}
.opt i{width:8px;height:8px;border-radius:50%;background:var(--sc)}
.opt[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cnt{font-family:var(--f-mono);font-size:11px;color:var(--fg-3);font-weight:400}
.cnt.over{color:var(--bad)}
.copyhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.thread{display:flex;flex-direction:column;gap:8px}
.msg{background:var(--sunk);border-radius:6px;padding:8px 10px;font-size:13px}
.msg .who{font-size:12px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.msg .who span{font-weight:400;color:var(--fg-3);font-family:var(--f-mono);font-size:11px}
.msg p{margin:3px 0 0;white-space:pre-wrap}
.approve{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;padding:8px 10px;border:1px dashed var(--line-2);border-radius:6px}
.approve.on{border-style:solid;border-color:var(--ok);color:var(--ok)}
.src{font-size:12px;color:var(--fg-3)}
.confirm{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--bad);font-weight:600}
.minitasks{display:flex;flex-direction:column;gap:6px}
.mt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.mt.done span.t{text-decoration:line-through;color:var(--fg-3)}
.addtask{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px}

.empty{padding:40px 20px;text-align:center;color:var(--fg-3);background:var(--panel);border:1px dashed var(--line-2);border-radius:var(--r)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;z-index:60;box-shadow:var(--shadow)}
.banner{background:var(--camp-soft);color:var(--camp);padding:8px 12px;border-radius:6px;font-size:13px;font-weight:600;margin-bottom:12px}


/* collapsible sections in the content card */
details.fold{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);min-width:0}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);font-weight:700;user-select:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"";width:6px;height:6px;border-right:2px solid var(--fg-3);border-bottom:2px solid var(--fg-3);transform:rotate(-45deg);flex:none;margin:0 2px}
details.fold[open]>summary::before{transform:rotate(45deg)}
details.fold>summary:hover{color:var(--fg)}
details.fold>summary .hint{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--fg-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:62%}
details.fold>.in{padding:2px 12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.foldbar{display:flex;justify-content:flex-end;gap:6px}
/* formats by family */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.cat{border:1px solid var(--line-2);border-radius:6px;background:var(--panel);padding:8px 10px;font-weight:700;font-size:13px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.cat small{font-weight:500;color:var(--fg-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cat[aria-pressed="true"] small{color:var(--accent)}
.catblock{border-left:3px solid var(--accent-soft);padding-left:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.catblock>b{font-size:12px;color:var(--fg-2);text-transform:uppercase;letter-spacing:.06em}
.spec{background:var(--sunk);border-radius:6px;padding:8px 10px;display:grid;gap:6px;min-width:0}
.spec .sh{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.spec .sr{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0}
.spec .sr>span{font-size:11px;color:var(--fg-3);width:104px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;flex:none}
.spec input.input{width:auto;flex:1;min-width:80px;padding:4px 8px;font-size:13px}
.spec input.input.other{flex:0 1 90px}
.opt.sm{padding:2px 9px;font-size:12px;font-family:var(--f-mono);font-weight:500}
/* jobs -> tasks */
.needs{display:flex;flex-direction:column;gap:6px}
.need{display:grid;grid-template-columns:auto minmax(0,1fr) 130px 145px;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.need.off{opacity:.55}
.need:has(input[type=checkbox]:not(:checked)){opacity:.5}
.need select.input,.need input.input{padding:3px 6px;font-size:12px}
.need input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent)}
.needadd{display:flex;flex-wrap:wrap;gap:6px}
.needadd button{border:1px dashed var(--line-2);background:none;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--fg-2);font-weight:600}
.needadd button:hover{border-color:var(--fg-3);color:var(--fg)}
.auto{font-size:10px;font-family:var(--f-mono);color:var(--accent);border:1px solid var(--accent-soft);border-radius:3px;padding:0 4px;margin-left:4px;white-space:nowrap}
.auto.done{color:var(--ok);border-color:var(--ok)}
.help{font-size:12px;color:var(--fg-3)}
/* calendar: week */
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));min-width:910px}
.whead{padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sunk);border-right:1px solid var(--line);text-align:left;border-top:0;border-left:0;display:flex;align-items:baseline;gap:8px}
.whead:nth-child(7){border-right:0}
.whead b{font-family:var(--f-display);font-size:22px;font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums}
.whead span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.whead.today b{color:var(--accent)}
.wcol{border-right:1px solid var(--line);min-height:460px;padding:8px;display:flex;flex-direction:column;gap:5px;cursor:pointer;min-width:0}
.wcol:nth-child(14){border-right:0}
.wcol.we{background:color-mix(in srgb,var(--sunk) 35%,transparent)}
.wcol .cc .t{-webkit-line-clamp:5}
.spl{display:block;font-family:var(--f-mono);font-size:10px;color:var(--fg-3);margin-top:2px;line-height:1.3}
/* calendar: agenda */
.agenda{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.arow{display:grid;grid-template-columns:88px minmax(0,1fr);border-bottom:1px solid var(--line);min-height:42px;cursor:pointer}
.arow:last-child{border-bottom:0}
.arow.we{background:color-mix(in srgb,var(--sunk) 45%,transparent)}
.arow .ad{padding:8px 10px;border-right:1px solid var(--line);display:flex;align-items:baseline;gap:6px}
.arow .ad b{font-family:var(--f-display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;min-width:24px}
.arow .ad span{font-size:11px;text-transform:uppercase;color:var(--fg-3);font-weight:700;letter-spacing:.05em}
.arow.today .ad b{color:var(--accent)}
.arow.today .ad{box-shadow:inset 3px 0 0 var(--accent)}
.arow .ai{padding:7px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.arow .ai .cc,.arow .ai .ev{width:auto;max-width:100%}
.arow .ai .tk{width:auto}
.arow .empt{font-size:12px;color:var(--fg-3);opacity:0}
.arow:hover .empt{opacity:1}
/* calendar: day */
.dayv{display:flex;flex-direction:column;gap:10px;max-width:860px}
.dcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;cursor:pointer;min-width:0}
.dcard:hover{border-color:var(--fg-3);border-left-color:var(--c)}
.dcard h3{font-size:16px}
.dcard .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--fg-3)}
.dcard .cp{font-size:13px;color:var(--fg-2);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ev.big{font-size:13px;padding:7px 10px;width:auto}
.dsec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:700;margin-top:6px}
/* import */
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:20px;text-align:center;display:grid;gap:6px;color:var(--fg-2);cursor:pointer;font-size:13px}
.drop b{color:var(--fg);font-size:14px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{justify-self:center;max-width:100%}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.imp-wrap{overflow:auto;max-height:46vh;border:1px solid var(--line);border-radius:6px}
.imp-wrap table{min-width:600px;font-size:12px}
.imp-wrap th{position:sticky;top:0}
.imp-wrap td,.imp-wrap th{padding:5px 8px}
.imp-wrap select{padding:2px 4px;font-size:12px;border:1px solid var(--line-2);border-radius:4px;background:var(--panel)}
tr.bad td{color:var(--fg-3)}
tr.dupe td{background:var(--camp-soft)}
.impsum{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:620px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}.need{grid-template-columns:auto minmax(0,1fr)}.need select.input,.need input.input{grid-column:2}}
/* full-width content card */
.dgrid{display:flex;flex-direction:column;gap:10px;min-width:0}
.dcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.drawer.full{width:100%;border-left:0}
.drawer.full .dh,.drawer.full .df{padding-left:max(18px,calc((100% - 1500px)/2));padding-right:max(18px,calc((100% - 1500px)/2))}
.drawer.full .db{padding-left:max(18px,calc((100% - 1500px)/2));padding-right:max(18px,calc((100% - 1500px)/2))}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.drawer:not(.full) .row4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:860px){.row4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.row4{grid-template-columns:minmax(0,1fr)}}
.db>*{flex-shrink:0}
.stbar{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;align-self:flex-start;background:var(--panel);max-width:100%}
.stbtn{border:0;border-right:1px solid var(--line);background:transparent;padding:7px 14px;font-size:13px;font-weight:600;color:var(--fg-2);display:inline-flex;align-items:center;gap:6px}
.stbtn:last-child{border-right:0}
.stbtn i{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.45}
.stbtn:hover{background:var(--sunk)}
.stbtn[aria-pressed="true"]{background:var(--c);color:#fff}
.stbtn[aria-pressed="true"] i{background:#fff;opacity:1}
.nlab{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);align-self:center;margin-right:2px}
.needadd button.sugg{border-style:solid;border-color:var(--accent);color:var(--accent)}
/* guided creation */
.drawer.modal{top:50%;left:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(860px,calc(100% - 32px));height:min(820px,calc(100% - 48px));border:1px solid var(--line);border-radius:14px;overflow:hidden}
.drawer.modal .dh{padding-top:12px}
.drawer.modal .db{padding:18px 28px 24px}
.drawer.modal .df{padding-bottom:12px}
@media (prefers-reduced-motion:no-preference){.drawer.modal{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,-47%)}}}
@media (max-width:620px){.drawer.modal{top:0;left:0;transform:none;width:100%;height:100%;border-radius:0;border:0}.drawer.modal .db{padding:14px 16px}
  @media (prefers-reduced-motion:no-preference){.drawer.modal{animation:none}}}
.wz{max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-top:8px}
.wzdots{display:flex;gap:4px;flex-wrap:wrap}
.wzdot{border:0;background:none;display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:0;flex:1;min-width:64px;color:var(--fg-3);font-size:11px;font-weight:600}
.wzdot i{display:block;height:4px;width:100%;border-radius:2px;background:var(--line)}
.wzdot.ok i{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.wzdot.on i{background:var(--accent)}
.wzdot.on{color:var(--accent)}
.wzq{display:flex;flex-direction:column;gap:10px}
.wzq h2{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.02em}
.wzhelp{margin:0;color:var(--fg-2);font-size:14px;max-width:62ch}
.wzbody{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.input.big{font-size:18px;padding:12px 14px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.pick{border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r);padding:14px 16px;text-align:left;font-size:15px;font-weight:600;color:var(--fg)}
.pick:hover{border-color:var(--accent)}
.pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.wzcr{border:1px solid var(--line);border-left:4px solid var(--fc);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.wzcrh{display:flex;align-items:center;gap:8px}.wzcrh b{flex:1}
.wzline{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.wzsum dd .link{font-weight:500}
.drawer:has(.wz) .df{justify-content:flex-end}
/* task tree in content card */
.tlink{border:0;background:none;padding:0;font-weight:700;font-size:13px;color:var(--fg);text-align:left;cursor:pointer}
.tlink:hover{color:var(--accent);text-decoration:underline}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.flash{animation:flash 1.4s ease-out}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:2px solid var(--accent)}}
.ttree{display:grid;gap:8px}
.tnode{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--panel)}
.tnode.done .thead b{text-decoration:line-through;color:var(--fg-3)}
.thead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.thead input{width:15px;height:15px;accent-color:var(--accent)}
.tmeta{margin-left:auto;font-size:12px;color:var(--fg-3);font-family:var(--f-mono)}
.tsubs{display:grid;gap:3px;margin:6px 0 0 23px}
.tdot{width:13px;height:13px;border:1.5px dashed var(--line-2);border-radius:3px;display:inline-block;flex:none}
.tdot.sm{width:11px;height:11px}
/* creatives */
.crlist{display:grid;gap:10px}
details.crcard{border:1px solid var(--line);border-left:4px solid var(--fc);border-radius:var(--r);background:var(--panel);min-width:0}
details.crcard>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 12px;min-width:0}
details.crcard>summary::-webkit-details-marker{display:none}
details.crcard>summary::after{content:"+";margin-left:6px;color:var(--fg-3);font-family:var(--f-mono)}
details.crcard[open]>summary::after{content:"–"}
details.crcard>summary b{font-size:14px;white-space:nowrap}
details.crcard>summary .hint{margin-left:auto;font-size:12px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crnum{font-family:var(--f-mono);font-size:11px;color:var(--fg-3)}
.crfam{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--fc);border:1px solid var(--fc);border-radius:3px;padding:0 5px}
details.crcard>.in{padding:2px 12px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.crrow{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;align-items:start;min-width:0}
.crl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3);padding-top:6px}
.crsec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);font-weight:800;border-top:1px dashed var(--line);padding-top:10px}

/* Toda la persistencia pasa por store.js (window.Store). Estas tres funciones son el único punto de contacto. */
async function write(col,id,data,isNew){
  if(!db){toast('Sin conexión con la base de datos');return false}
  try{
    if(isNew) await Store.create(col,id,data);
    else await Store.update(col,id,data);
    return true;
  }catch(e){
    if(e&&e.code==='invalid_argument'&&!isNew){readOnly=true;toast('No tienes permiso para editar. Pide acceso de colaborador.')}
    else if(e&&e.code==='permission-denied')toast('Tu acceso no permite guardar esto (es de otro colegio o tu acceso es de solo lectura).');
    else toast('No se pudo guardar: '+(e?.message||e?.code||'error'));
    return false;
  }
}

function pickMonth(){
  const cur=TODAY.slice(0,7);
  const has=m=>contents().some(c=>c.date&&c.date.startsWith(m)&&c.status!=='archivo');
  if(has(cur))return cur;
  const up=contents().filter(c=>c.date>=TODAY&&c.status!=='archivo').sort(byDate)[0];
  return up?up.date.slice(0,7):cur;
}

function calMonth(D){
  const [y,mo]=UI.month.split('-').map(Number);
  const first=new Date(y,mo-1,1);const start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const days=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push(iso(d))}
  const last=iso(new Date(y,mo,0));
  while(days.length>35&&days[days.length-7]>last)days.splice(-7);
  const cells=days.map((d,i)=>{
    const dd=parse(d);const out=d.slice(0,7)!==UI.month;const we=dd.getDay()===0||dd.getDay()===6;
    const {e,cp,cs,ts}=itemsOn(d,D,{compactEv:true,rowStart:i%7===0});
    const max=4;
    return `<div class="day ${out?'out':''} ${we?'we':''} ${d===TODAY?'today':''}" data-day="${d}">
      <div class="num"><span>${dd.getDate()}</span><button class="add" data-new-content="${d}" aria-label="Nuevo contenido el ${fdate(d)}">+</button></div>
      ${evAndCp(e,cp,d)}${cs.slice(0,max).map(c=>chip(c)).join('')}
      ${cs.length>max?`<button class="more" data-goday="${d}">+${cs.length-max} más</button>`:''}
      ${ts.map(tkBtn).join('')}</div>`}).join('');

function taskCard(t,opt){
  const c=t.contentId&&S.contents[t.contentId];const subs=t.subtasks||[];const nd=subs.filter(x=>x.done).length;const st=taskState(t);
  return `<div class="task ${t.done?'done':''}${st==='Bloqueado'?' blocked':''}"><input type="checkbox" data-toggle-task="${t.id}" ${t.done?'checked':''} aria-label="Hecha">
    <div style="min-width:0"><div class="tt" ${t.contentId&&(t.autoKey==='creative'||t.autoKey==='publish')?`data-opencr="${t.contentId}|${t.creativeId||''}" title="Abrir el briefing"`:`data-open="task:${t.id}"`}>${esc(t.title)}</div>
    <div class="tm">${opt&&opt.state?`<select class="input tstate" data-taskstate="${t.id}" aria-label="Estado">${TASK_ST.map(s=>`<option ${s===st?'selected':''}>${s}</option>`).join('')}</select>`:(st==='En curso'||st==='Bloqueado'?stPill(st):'')}${opt&&opt.who?`<span class="tag">${esc(t.assignee||'Sin asignar')}</span>`:''}${dueTag(t)}${subs.length?`<span class="mono">${nd}/${subs.length}</span>`:''}${schTags(t.schools)}${c?`<button class="link" data-open="content:${c.id}">→ ${esc(c.title)} (${fdate(c.date,'short')})</button>`:''}${t.campaignId&&S.campaigns[t.campaignId]?`<span class="tag">${esc(t.fase||'')}</span><button class="link" data-open="campaign:${t.campaignId}">→ ${esc(S.campaigns[t.campaignId].title||'Campaña')}</button>`:''}</div>
    ${subs.length?`<div class="subs">${subs.map(x=>`<label class="sub ${x.done?'done':''}"><input type="checkbox" data-subtoggle="${t.id}|${x.key}" ${x.done?'checked':''}><span>${esc(x.label)}${/^x_/.test(x.key)&&!t.done?`<button class="subx" data-subdel="${t.id}|${x.key}" title="Quitar subtarea" aria-label="Quitar subtarea">×</button>`:''}</span>${x.assignee&&x.assignee!==t.assignee?`<em>${esc(x.assignee)}</em>`:'<em></em>'}${subDue(x)}</label>`).join('')}</div>`:''}${subs.length&&!t.done?`<div class="subadd"><button class="link" data-subadd="${t.id}">+ subtarea</button></div>`:''}</div></div>`;
}
function subCard(t,x){const c=t.contentId&&S.contents[t.contentId];
  return `<div class="task subt ${x.done?'done':''}"><input type="checkbox" data-subtoggle="${t.id}|${x.key}" ${x.done?'checked':''} aria-label="Hecha">
    <div style="min-width:0"><div class="tt" ${t.contentId?`data-opencr="${t.contentId}|${t.creativeId||''}" title="Abrir el briefing"`:`data-open="task:${t.id}"`}>${esc(x.label)}</div>
    <div class="tm">${subDue(x)}<span>Subtarea de ${esc(t.assignee||'sin asignar')}</span>${c?`<button class="link" data-open="content:${c.id}">→ ${esc(t.title.replace(/^Crear |^Publicar · /,''))}</button>`:''}</div></div></div>`}
const byDue=(a,b)=>(a.done-b.done)||(a.deadline||'9999').localeCompare(b.deadline||'9999');
const withDone=(all,keep)=>all.filter(t=>!t.done).sort(byDue).concat(all.filter(t=>t.done).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')).slice(0,UI.taskDone?9999:keep));
const taskModeSeg=(key,val,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button data-${key}="${v}" aria-pressed="${val===v}">${l}</button>`).join('')}</div>`;
/* agrupaciones compartidas por «Mis tareas» y «Tareas del equipo».
   items: {t, x?, due, done} (x = subtarea asignada dentro de la tarea de otra persona) */
function groupedTasks(items,mode,showWho){
  const card=it=>it.x?subCard(it.t,it.x):taskCard(it.t,{who:showWho});
  const grp=(title,list,note)=>list.length?`<section class="sec"><h3>${title}<em class="muted">${list.length}${note?' · '+note:''}</em></h3><div style="display:grid;gap:6px">${list.sort((a,b)=>(a.done-b.done)||(a.due||'9999').localeCompare(b.due||'9999')).map(card).join('')}</div></section>`:'';
  if(mode==='urgencia'){const w=addDays(TODAY,7);const op=items.filter(i=>!i.done);
    return grp('<span style="color:var(--bad)">Vencidas</span>',op.filter(i=>i.due&&i.due<TODAY))+grp('Hoy',op.filter(i=>i.due===TODAY))+grp('Próximos 7 días',op.filter(i=>i.due>TODAY&&i.due<=w))
      +grp('Más adelante',op.filter(i=>i.due>w))+grp('Sin fecha',op.filter(i=>!i.due))+grp('Hechas',items.filter(i=>i.done))}
  const proj=it=>it.t.campaignId?'cp:'+it.t.campaignId:it.t.contentId?'co:'+it.t.contentId:'';
  const groups={};items.forEach(it=>{(groups[proj(it)]=groups[proj(it)]||[]).push(it)});const keys=Object.keys(groups);
  const block=(label,pref,titleOf)=>{const ks=keys.filter(k=>k.startsWith(pref)).sort((a,b)=>titleOf(a).date.localeCompare(titleOf(b).date));
    return ks.length?`<div class="dsec" style="font-size:13px;margin-top:4px">${label}</div>${ks.map(k=>{const x=titleOf(k);return grp(`<button class="link" style="font-size:12px" data-open="${x.open}">${esc(x.title)}</button>`,groups[k],x.meta)}).join('')}`:''};
  return block('Plan de acción','cp:',k=>{const c=S.campaigns[k.slice(3)]||{};return {title:c.title||'Campaña',date:c.start||'9999',open:'campaign:'+k.slice(3),meta:fdate(c.start,'short')}})
    +block('Plan de contenidos','co:',k=>{const c=S.contents[k.slice(3)]||{};return {title:c.title||'Contenido',date:c.date||'9999',open:'content:'+k.slice(3),meta:fdate(c.date,'short')}})
    +(groups['']?`<div class="dsec" style="font-size:13px;margin-top:4px">Otras tareas</div>${grp('Sin proyecto',groups[''])}`:'')}
const areaSeg=(key,val)=>canAccion()&&canContenidos()?taskModeSeg(key,val,[['todo','Todo'],['accion','Plan de acción'],['contenidos','Plan de contenidos']]):'';
const inArea=(t,a)=>a==='todo'||taskArea(t)===a;
function viewTasks(){
  const ppl=app().people.slice();const mode=UI.taskMode;
  const all=arr(S.tasks).filter(inSchool).filter(areaOk).filter(t=>inArea(t,UI.teamArea));
  const ts=all.filter(t=>UI.taskDone||!t.done).sort(byDue);
  const late=all.filter(t=>!t.done&&t.deadline&&t.deadline<TODAY).length;const bl=all.filter(t=>taskState(t)==='Bloqueado').length;
  const tools=`<div class="tools">${taskModeSeg('taskmode',mode,[['persona','Por persona'],['urgencia','Por urgencia'],['estado','Por estado'],['proyecto','Por proyecto']])}${areaSeg('teamarea',UI.teamArea)}
    <label class="layers"><input type="checkbox" id="task-done" ${UI.taskDone?'checked':''}>Mostrar hechas</label><button class="btn primary" data-new-task="">+ Tarea</button></div>`;
  const sub=`${all.filter(t=>!t.done).length} abiertas${bl?` · <span style="color:var(--bad);font-weight:600">${bl} bloqueadas</span>`:''}${late?` · <span style="color:var(--bad);font-weight:600">${late} vencidas</span>`:''}`;
  if(mode!=='persona'){const body=mode==='estado'?stateBoard(withDone(all,15),true):groupedTasks(ts.map(t=>({t,due:t.deadline,done:t.done})),mode,true);
    const hint={estado:' · Arrastra una tarea a otra columna o cambia su estado en la tarjeta'+(UI.taskDone?'':' · En «Hecho» salen las 15 últimas'),urgencia:' · Agrupadas por fecha límite',proyecto:' · Agrupadas por campaña y por contenido'}[mode];
    return `<div class="head"><div><h2>Tareas del equipo</h2><div class="sub">${sub}${hint}</div></div>${tools}</div>
      ${ts.length||mode==='estado'?body:'<div class="empty"><b>No hay tareas con estos filtros</b>Cambia a «Todo» o marca «Mostrar hechas».</div>'}`}
  const extra=[...new Set(ts.map(t=>t.assignee).filter(a=>a&&!ppl.includes(a)))];
  const cols=ppl.concat(extra).concat(['']);
  const board=cols.map(p=>{const list=ts.filter(t=>(t.assignee||'')===p);
    const subs=p?all.filter(t=>!t.done&&(t.assignee||'')!==p).flatMap(t=>(t.subtasks||[]).filter(x=>x.assignee===p&&(UI.taskDone||!x.done)).map(x=>[t,x])).sort((a,b)=>(a[1].due||'9999').localeCompare(b[1].due||'9999')):[];
    if(!p&&!list.length)return '';
    return `<section class="col"><h3>${p?esc(p):'Sin asignar'}${p&&p===UI.me?' <span class="tag">tú</span>':''}<span class="mono">${list.filter(t=>!t.done).length+subs.filter(([,x])=>!x.done).length}</span></h3>
      ${list.map(taskCard).join('')}${subs.map(([t,x])=>subCard(t,x)).join('')}${!list.length&&!subs.length?'<div class="muted" style="font-size:12px;padding:4px">Nada pendiente</div>':''}<button class="btn ghost sm" data-new-task="${esc(p)}">+ Tarea</button></section>`}).join('');
  return `<div class="head"><div><h2>Tareas del equipo</h2><div class="sub">${sub} · Ordenadas por fecha límite · Las subtareas asignadas a otra persona aparecen también en su columna</div></div>${tools}</div>
    <div class="board">${board}</div>`;
}

  const A=UI.myArea;
  const all=arr(S.tasks).filter(inSchool).filter(areaOk).filter(t=>inArea(t,A));
  const mine=all.filter(t=>t.assignee===me);
  const subs=all.filter(t=>t.assignee!==me&&!t.done).flatMap(t=>(t.subtasks||[]).filter(x=>x.assignee===me&&(UI.taskDone||!x.done)).map(x=>[t,x]));
  const open=mine.filter(t=>!t.done);const late=open.filter(t=>t.deadline&&t.deadline<TODAY).length;const bl=open.filter(t=>taskState(t)==='Bloqueado').length;
  const items=mine.filter(t=>UI.taskDone||!t.done).map(t=>({t,due:t.deadline,done:t.done})).concat(subs.map(([t,x])=>({t,x,due:x.due,done:x.done})));
  const body=UI.myMode==='estado'?stateBoard(withDone(mine,15)):groupedTasks(items,UI.myMode,false);

  return `<div class="head"><div><h2>Mis tareas</h2><div class="sub">${esc(me)} · ${open.length} abiertas${subs.length?` y ${subs.filter(([,x])=>!x.done).length} subtareas`:''}${late?` · <span style="color:var(--bad);font-weight:600">${late} vencidas</span>`:''}${bl?` · ${bl} bloqueadas`:''}</div></div>

    ${empty?`<div class="empty"><b>No tienes tareas aquí</b>${A!=='todo'?'Prueba con «Todo» o ':''}Crea una con «+ Tarea».</div>`:body}`}

const OK_TYPES={'application/pdf':'PDF','image/png':'PNG','image/jpeg':'JPG','image/svg+xml':'SVG','image/webp':'WEBP','image/gif':'GIF'};
const EXT_TYPE={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',svg:'image/svg+xml',webp:'image/webp',gif:'image/gif'};
const fsize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const blobUrl=id=>Store.fileUrl(id);
function fileRow(f,sid){const t=OK_TYPES[f.type]||'';const isLink=f.kind==='link'||!!f.url;

async function uploadFiles(sid,kind,fileList){
  if(!assets){toast('Necesitas permiso de edición para subir archivos');return}
  const files=[...fileList||[]];if(!files.length)return;const added=[];let i=0;
  for(const f of files){i++;const ext=(f.name.split('.').pop()||'').toLowerCase();const type=OK_TYPES[f.type]?f.type:EXT_TYPE[ext];
    if(!type){toast(`«${f.name}» no es PDF ni imagen compatible`);continue}
    if(kind==='manual'&&type!=='application/pdf'&&files.length===1){/* allow images as manual too */}
    UI.uploading=`Subiendo ${i}/${files.length}: ${f.name}…`;render();
    try{const r=await assets.upload(f,{type});added.push({id:r.id,name:f.name,type:r.contentType||type,size:r.sizeBytes||f.size,kind:kind==='auto'?(type==='application/pdf'?'manual':'logo'):kind,uploadedAt:nowStamp(),uploadedBy:UI.me||''})}
    catch(e){const m={too_large:'es demasiado grande (máx. 20 MB, SVG 2 MB)',unsupported_type:'no es un tipo de archivo admitido',quota_or_state:'no cabe: el espacio de archivos está lleno',rate_limited:'espera un momento y vuelve a intentarlo',not_granted:'no tienes permiso para subir archivos'}[e?.code]||'no se pudo subir';toast(`«${f.name}» ${m}`)}}
  UI.uploading='';
  if(added.length){const cur=(S.schools[sid]?.files)||[];if(await write('schools',sid,{files:cur.concat(added)}))toast(`${added.length} archivo${added.length>1?'s':''} subido${added.length>1?'s':''}`)}
  render()}
async function deleteFile(sid,key){
  const cur=(S.schools[sid]?.files)||[];const f=cur.find(x=>(x.id||x.url)===key);if(!f)return;
  if(f.id&&assets){try{await assets.delete(f.id)}catch(e){toast('No se pudo borrar el archivo');return}}
  await write('schools',sid,{files:cur.filter(x=>x!==f)});UI.confirmFile='';toast('Borrado');render()}

const nCount=d=>{const l=nList(d);return {n:l.length,b:l.filter(s=>s.split).length}};
const blankStep=(p,r,dias)=>({id:cid(),parentId:p||'',rama:r||'',dias:dias,nombre:'',canal:'',asunto:'',mensaje:'',estado:'Pendiente'});
function migrateNurturing(d){if(Array.isArray(d.nurturing)||!(d.lineaTemporal||[]).length)return;const fe=nEventDate(d);
  d.nurturing=d.lineaTemporal.map(x=>({id:x.id||cid(),parentId:'',rama:'',dias:fe&&x.fecha?Math.round((parse(x.fecha)-parse(fe))/864e5):0,nombre:x.nombre||'',canal:x.canal||'',asunto:'',mensaje:x.descripcion||'',estado:x.estado||'Pendiente'}));d.lineaTemporal=[]}
function nStepCard(d,s,fe,ro){const open=drawer.nOpen===s.id;const ch=s.canal?campChName(s.canal):'';const date=fe?addDays(fe,+s.dias||0):'';

        <label class="f">Canal<select class="input" data-ns="${s.id}|canal"><option value="">—</option>${optList(campChannels(),s.canal)}</select></label>
        <label class="f">Estado<select class="input" data-ns="${s.id}|estado">${optList(ESTADOS_TAREA,s.estado||'Pendiente')}</select></label></div>
      ${inp2(s,'asunto','Asunto o titular','text','Ej. ¡Te esperamos el sábado!')}
      <label class="f">Texto del mensaje<textarea class="input" rows="5" data-ns="${s.id}|mensaje" placeholder="El texto que recibirán las familias en este paso">${esc(s.mensaje||'')}</textarea></label>
      ${ro?'':`<div class="cracts">${s.split?'':`<button type="button" class="btn sm" data-nsplit="${s.id}">Bifurcar aquí</button>`}<button type="button" class="btn sm ghost danger" data-ndel="${s.id}">Borrar paso${s.split?' y sus caminos':''}</button></div>`}
    </div>`:''}

const inp2=(s,f,label,type,ph)=>`<label class="f">${label}<input class="input" type="${type}" data-ns="${s.id}|${f}" value="${esc(s[f]||'')}" placeholder="${esc(ph||'')}"></label>`;
function nSplit(d,s,fe,ro){const sp=s.split;
  return `<div class="nsplit"><div class="nq"><span class="nfork" aria-hidden="true">⑂</span>
      ${ro?`<b>${esc(sp.q)}</b>`:`<select class="input" data-npreset="${s.id}" aria-label="Pregunta preparada"><option value="">Pregunta…</option>${N_PRESETS.map(p=>`<option value="${p[0]}">${esc(p[1])}</option>`).join('')}</select>
      <input class="input" data-nsp="${s.id}|q" value="${esc(sp.q)}" aria-label="Qué decide el camino">`}
      ${ro?'':`<button type="button" class="btn sm ghost danger" data-nunsplit="${s.id}" title="Quita los dos caminos y sus comunicaciones">Quitar bifurcación</button>`}</div>
    <div class="nbranches">${['si','no'].map(r=>`<div class="nbr ${r}"><div class="nbrh">${ro?esc(sp[r]):`<input class="input" data-nsp="${s.id}|${r}" value="${esc(sp[r])}" aria-label="Nombre del camino">`}</div>
      ${nSeqHtml(d,s.id,r,fe,ro,false)}</div>`).join('')}</div></div>`}
function nSeqHtml(d,p,r,fe,ro,root){const seq=nSeq(d,p,r);let html='';let evShown=!root;
  seq.forEach(s=>{if(!evShown&&(+s.dias||0)>=0){html+=nEventMark(d,fe);evShown=true}html+=nStepCard(d,s,fe,ro)});
  if(!evShown)html+=nEventMark(d,fe);
  const last=seq.length?(+seq[seq.length-1].dias||0):(root?-7:0);
  return `<div class="nseq">${html||'<div class="help">Sin comunicaciones en este camino.</div>'}${ro?'':`<button type="button" class="nadd" data-nadd="${p}|${r}|${last+(seq.length?2:(root?0:2))}">+ Comunicación</button>`}</div>`}
const nEventMark=(d,fe)=>{const ev=d.eventId&&S.events[d.eventId];return `<div class="nevent"><b>${esc(ev?ev.title:(d.title||'El evento'))}</b><span>${fe?fdate(fe,'y'):'Sin fecha del evento'}</span></div>`};
function nurturingBlock(d){migrateNurturing(d);const fe=nEventDate(d);const ro=drawerRO();
  return `<div class="help">Las comunicaciones antes y después del evento. Pulsa una para escribir su texto. «Bifurcar aquí» separa el camino según lo que haga la familia: por ejemplo, un mensaje para quien vino y otro para quien no vino.</div>

function campEventOpts(d){return arr(S.events).filter(e=>e.kind!=='nolectivo'&&(!(d.schools||[]).length||(e.schools||[]).some(s=>d.schools.includes(s)))).sort((a,b)=>b.start.localeCompare(a.start)).map(e=>[e.id,e.title+' · '+fdate(e.start,'short')])}
function campBasics(d,big){const vinc=d.campanaTipo==='vinculada_evento';

    <div class="row4">${selk('campanaTipo','Tipo de campaña',d.campanaTipo,[['comunicacion','Comunicación al uso'],['vinculada_evento','Vinculada a un evento']],'—')}${selk('tipo','Formato',d.tipo,TIPOS_CAMP,'—')}${selk('estado','Estado',d.estado,ESTADOS_CAMP,'—')}${selk('owner','Responsable',d.owner,app().people,'Sin asignar')}</div>
    ${vinc?`<div class="row4">${selk('eventoVinculoModo','Fecha del evento',d.eventoVinculoModo,[['existente','De un evento ya creado'],['manual','La pongo a mano']],'—')}

function campObjetivo(d,big){return `${big?`<input class="input big" data-k="objetivoConceptual" data-wzfocus value="${esc(d.objetivoConceptual||'')}" placeholder="Ej. Que 25 familias visiten el colegio y 15 agenden entrevista">`:area('objetivoConceptual','Objetivo conceptual (una frase)',d.objetivoConceptual,'rows="2" placeholder="Qué quieres conseguir con esto"')}

    <div class="row4">${selk('kpiTipo','¿Qué medimos?',d.kpiTipo,KPI_TIPOS,'Sin elegir')}${inp('kpiObjetivo','KPI objetivo (número)',d.kpiObjetivo,'type="number" placeholder="25"')}${inp('comoSeMide','¿Cómo se mide?',d.comoSeMide,'placeholder="Formulario de asistencia"')}</div>`}
function campCanales(d){return `<label class="f">Canales de activación y comunicación${multi('canal',d.canal,campChannels())}</label>
    <div class="row4">${inp('utm','UTM / código de tracking',d.utm,'placeholder="utm_campaign=…"')}${selk('seguimientoTipo','¿Dónde se hace el seguimiento?',d.seguimientoTipo,SEGUIMIENTO,'—')}${d.seguimientoTipo==='Otro (especificar)'?inp('seguimientoOtro','Herramienta',d.seguimientoOtro):''}</div>`}
function campAudiencia(d){return `${area('publicoObjetivo','Público objetivo',d.publicoObjetivo,'rows="2" placeholder="Familias con hijos de 3 a 6 años en la zona"')}

function campPresupuesto(d){return `<div class="row4">${inp('presupuesto','Presupuesto estimado (€)',d.presupuesto,`type="number" placeholder="800" ${d.presupuestoPorDefinir?'disabled':''}`)}${inp('costeReal','Coste real (€)',d.costeReal,'type="number" placeholder="Al terminar"')}</div>

function campResultados(d){const cplP=parseFloat(d.presupuesto)>0&&parseFloat(d.kpiObjetivo)>0?(parseFloat(d.presupuesto)/parseFloat(d.kpiObjetivo)).toFixed(2):null;
  const cplR=parseFloat(d.costeReal)>0&&parseFloat(d.resultadoReal)>0?(parseFloat(d.costeReal)/parseFloat(d.resultadoReal)).toFixed(2):null;
  return `<div class="row4">${inp('resultadoReal','Resultado real'+(d.kpiTipo?' ('+d.kpiTipo.toLowerCase()+')':' · elige qué medimos en «Objetivo»'),d.resultadoReal,'type="number" placeholder="Al terminar"')}${inp('inscripcionesEvento','Inscripciones al evento',d.inscripcionesEvento,'type="number"')}${inp('tasaAsistencia','Asistencia (%)',d.tasaAsistencia,'type="number"')}</div>
    ${campPresupuesto(d)}
    ${cplP||cplR?`<div class="kpis">${cplP?`<span>Coste por ${kpiUnit(d)} previsto: <b>${cplP} €</b></span>`:''}${cplR?`<span>Coste por ${kpiUnit(d)} real: <b>${cplR} €</b></span>`:''}</div>`:''}`}
function formCampaign(d){

/* asistente de campaña: una pregunta cada vez */
function cwzSteps(d){const s=['inicio','basico','objetivo','canales','audiencia','presupuesto','creatividades'];if(d.campanaTipo==='vinculada_evento')s.push('linea');s.push('tareas','resumen');return s}
const CWZ_L={inicio:'Tipo',basico:'Lo básico',objetivo:'Objetivo',canales:'Canales',audiencia:'Audiencia',presupuesto:'Presupuesto',creatividades:'Creatividades',linea:'Nurturing',tareas:'Tareas',resumen:'Revisar'};

    `<div class="picks"><button type="button" class="pick ${d.campanaTipo==='comunicacion'?'on':''}" data-cwtipo="comunicacion">Campaña de comunicación</button>

      <button type="button" class="pick" data-cwtipo="evento">Solo un evento del colegio</button></div>
     ${tpls.length?`<div class="dsec">O parte del banco de campañas</div><div class="opts">${tpls.map(t=>`<button type="button" class="opt" data-usetpl="${t.id}">${esc(t.title)} · ${fdate(tplDate(t.mesDia),'short')}</button>`).join('')}</div>`:''}`)}
  else if(st==='basico')body=Q('¿Cómo se llama y cuándo es?','',campBasics(d,true));
  else if(st==='objetivo')body=Q('¿Qué quieres conseguir?','En una frase. Luego marca en qué fase del funnel cuenta.',campObjetivo(d,true));
  else if(st==='canales')body=Q('¿Por dónde se va a comunicar?','Y dónde se registran los resultados.',campCanales(d));
  else if(st==='audiencia')body=Q('¿A quién quieres llegar?','Se marca solo según la fase elegida; ajústalo si hace falta.',campAudiencia(d));
  else if(st==='presupuesto')body=Q('¿Cuánto presupuesto tiene?','Si aún no se sabe, márcalo como por definir.',campPresupuesto(d)+`<div class="row4">${selk('estado','Estado',d.estado,ESTADOS_CAMP,'—')}</div>`);
  else if(st==='creatividades')body=Q('¿Qué materiales hay que producir?','Flyers, vídeos, carteles… Cada uno se convierte en una tarea al guardar. Las medidas, el brief y las subtareas los afinas luego en la ficha completa.',crWizCards(d.creatives,app())+crAddBar());
  else if(st==='linea')body=Q('¿Qué comunicaciones hay en torno al evento?','Recordatorios, invitaciones, agradecimiento… y caminos distintos según lo que haga cada familia.',nurturingBlock(d));
  else if(st==='tareas')body=Q('¿Qué hay que hacer antes, durante y después?','Cada tarea lleva su fecha: con eso se construye el flujo de la campaña.',listRows(d,'tareas',TAREA_COLS())+`<button type="button" class="btn sm" style="justify-self:start" data-cladd="tareas">+ Tarea</button>${(d.creatives||[]).length?`<div class="help">Además se crearán ${d.creatives.length} tareas a partir de las creatividades.</div>`:''}`);
  else{const ev=d.eventId&&S.events[d.eventId];
    body=Q('¿Está todo?','Al crear la campaña se guardan sus tareas y aparece en el calendario.',`<dl class="kvs wzsum">${[['Campaña',d.title],['Colegio',(d.schools||[]).map(sname).join(', ')],['Tipo',d.campanaTipo==='vinculada_evento'?'Vinculada a '+(ev?ev.title:(d.fechaEvento?'evento del '+fdate(d.fechaEvento,'short'):'un evento')):'Comunicación'],
      ['Fechas',d.start?fdate(d.start,'y')+(d.end&&d.end!==d.start?' – '+fdate(d.end,'y'):''):''],['Objetivo',d.objetivoConceptual],['Funnel',(d.fases||[]).join(', ')],['Canales',(d.canal||[]).map(campChName).join(', ')],
      ['Audiencia',(d.audiencia||[]).join(', ')],['Presupuesto',d.presupuestoPorDefinir?'Por definir':(d.presupuesto?d.presupuesto+' €':'')],['Tareas',((d.tareas||[]).filter(t=>t.title).length+(d.creatives||[]).length)+' tareas']]
      .map(([k,v])=>`<dt>${k}</dt><dd>${v?esc(v):'<span class="muted">Sin definir</span>'}</dd>`).join('')}</dl>`)}
  return `<div class="wz">${dots}${body}</div>`}
function campWizardFoot(){const d=drawer.draft;const n=cwzSteps(d).length;const last=drawer.step>=n-1;
  return `<button class="btn ghost" data-cwz="full" title="Ver todos los campos a la vez">Abrir ficha completa</button><span class="sp"></span>

function cwzGo(n){readForm();const d=drawer.draft;const steps=cwzSteps(d);

function suggestAud(d){(d.fases||[]).forEach(f=>(FASE_AUD[f]||[]).forEach(a=>{if(!(d.audiencia||[]).includes(a))(d.audiencia=d.audiencia||[]).push(a)}))}
async function saveCampaign(d){

function readForm(){

async function syncTasks(cid,d){
  regSubs(d);const ts=arr(S.tasks).filter(t=>t.contentId===cid&&t.autoKey);let made=0;const crs=d.creatives||[];
  const closed=d.status==='publicado'||d.status==='archivo';
  const mk=(subs,prev)=>Object.entries(subs||{}).filter(([k,v])=>v&&v.on&&NMAP[k]).sort((a,b)=>NMAP[a[0]].off-NMAP[b[0]].off)
    .map(([k,v])=>{const p=(prev||[]).find(x=>x.key===k);return {key:k,label:NMAP[k].label,assignee:v.who||'',due:v.due||(d.date?addDays(d.date,NMAP[k].off):''),done:!!(p&&p.done)}});
  const same=(t,x)=>['title','assignee','deadline','notes'].every(k=>(t[k]||'')===(x[k]||''))&&JSON.stringify(t.subtasks||[])===JSON.stringify(x.subtasks)&&JSON.stringify(t.schools||[])===JSON.stringify(x.schools);
  for(const cr of crs){const t=ts.find(x=>x.autoKey==='creative'&&x.creativeId===cr.id);

      notes:[crSpec(cr),(cr.channels||[]).map(chName).join(', '),cr.brief].filter(Boolean).join(' · ').slice(0,400),schools:d.schools||[],subtasks:mk(cr.subs,t&&t.subtasks),contentId:cid,creativeId:cr.id,autoKey:'creative'};
    if(!t){if(!closed&&await write('tasks',newId('tasks'),{...x,done:false,createdAt:nowStamp(),createdBy:UI.me||''},true))made++}
    else if(!t.done&&!same(t,x))await write('tasks',t.id,x)}
  for(const t of ts.filter(x=>x.autoKey==='creative'&&!crs.some(c=>c.id===x.creativeId)&&!x.done))await remove('tasks',t.id);
  const pub=ts.find(x=>x.autoKey==='publish');const pn=Object.fromEntries(Object.entries(d.needs||{}).filter(([k])=>PUB_KEYS.includes(k)));const psubs=mk(pn,pub&&pub.subtasks);
  if(psubs.length){const x={title:'Publicar · '+(d.title||''),assignee:d.owner||'',deadline:d.date||'',notes:crChannels(d).map(chName).join(', '),schools:d.schools||[],subtasks:psubs,contentId:cid,autoKey:'publish'};
    if(!pub){if(!closed&&await write('tasks',newId('tasks'),{...x,done:false,createdAt:nowStamp(),createdBy:UI.me||''},true))made++}else if(!pub.done&&!same(pub,x))await write('tasks',pub.id,x)}
  else if(pub&&!pub.done)await remove('tasks',pub.id);
  for(const t of ts.filter(x=>x.autoKey!=='creative'&&x.autoKey!=='publish'&&!x.done))await remove('tasks',t.id);
  return made}

async function saveDrawer(){
  const d=readForm();const k=drawer.kind;let col,data;
  if(!permCheck(k,d))return;
  if(k==='campaign'){await saveCampaign(d);return}
  if(k==='template'){if(!d.title.trim()){toast('Ponle nombre a la plantilla');return}
    if(d.mesDia&&!/^\d{2}-\d{2}$/.test(d.mesDia)){toast('La fecha habitual va como mes-día, por ejemplo 03-01');return}
    d.tareas=(d.tareas||[]).filter(t=>(t.descripcion||'').trim());}
  if(k==='content'){
    if(!d.title.trim()){toast('Ponle un título al contenido');return}
    Object.keys(d.copyByChannel||{}).forEach(ch=>{if(!(d.channels||[]).includes(ch)&&!d.copyByChannel[ch])delete d.copyByChannel[ch]});
    if(Array.isArray(d.creatives))d.creatives=d.creatives.filter(c=>c.fam||c.format);
    if(Array.isArray(d.creatives))deriveFromCreatives(d);else{Object.keys(d.specs||{}).forEach(f=>{if(!(d.formats||[]).includes(f))delete d.specs[f]});d.formatCats=[...catsOf(d)]}
    if(d.campaignId&&S.campaigns[d.campaignId]?.eventId&&!d.eventId)d.eventId=S.campaigns[d.campaignId].eventId;
    if(d.eventId&&S.events[d.eventId]&&!d.date)d.date=S.events[d.eventId].start;
    if(d.bank){d.date='';d.eventId=''}
    col='contents';data={...d,updatedAt:nowStamp(),updatedBy:UI.me||''};
    if(!drawer.isNew){delete data.comments;delete data.approved}
  }else if(k==='event'){
    if(!d.title.trim()||!d.start){toast('El evento necesita nombre y fecha de inicio');return}
    if(!d.end||d.end<d.start)d.end=d.start;col='events';data=d;
  }else if(k==='idea'){if(!d.title.trim()){toast('Escribe la idea');return}col='ideas';data=d}
  else if(k==='task'){if(!d.title.trim()){toast('Escribe la tarea');return}
    if(d.estado){const was=!!d.done;d.done=d.estado==='Hecho';if(d.done&&!was){d.doneAt=nowStamp();d.doneBy=UI.me||''}if(!d.done){d.doneAt=''}}
    if(d.contentId&&S.contents[d.contentId]&&!(d.schools||[]).length)d.schools=S.contents[d.contentId].schools;col='tasks';data=d}
  else if(k==='school'){if(!d.name.trim()){toast('Escribe el nombre del colegio');return}
    if(d.pillarsText!=null)d.pillars=splitPl(d.pillarsText);if(d.typesText!=null)d.types=splitPl(d.typesText);delete d.pillarsText;delete d.typesText;
    d.pillars=(d.pillars||[]).filter(p=>p.name);d.types=(d.types||[]).filter(p=>p.name);col='schools';data=d}
  else if(k==='person'){await savePerson(d);return}
  else if(k==='rollover'){return}
  else if(k==='template'){col='templates';data={...d,updatedAt:nowStamp()}}
  else if(k==='team'){const ppl=(d.peopleText||'').split('\n').map(s=>s.trim()).filter(Boolean);
    const exists=!!S.config.app;const ok=await write('config','app',exists?{people:ppl}:{...DEF_APP,people:ppl},!exists);if(ok){toast('Equipo actualizado');closeDrawer()}return}
  const id=drawer.isNew?(k==='school'?slug(d.name):newId(col)):drawer.id;
  const btn=$('[data-save]');if(btn){btn.disabled=true;btn.textContent='Guardando…'}
  const ok=await write(col,id,data,drawer.isNew);
  if(!ok){if(btn){btn.disabled=false;btn.textContent=drawer.isNew?'Crear':'Guardar'}return}
  let made=0;if(k==='content'&&!d.bank)made=await syncTasks(id,d);
  if(k==='content'&&drawer.isNew&&drawer.fromIdea)await write('ideas',drawer.fromIdea,{status:'programada',contentId:id});
  if(k==='content'&&d.bank){toast(drawer.isNew?'Guardado en el banco de contenidos':'Guardado');closeDrawer();return}
  toast((drawer.isNew?'Creado':'Guardado')+(made?` · ${made} tarea${made>1?'s':''} creada${made>1?'s':''}`:''));closeDrawer();
}

const yearFor=(m,ctx)=>m>=8?ctx.startY:ctx.startY+1;
function mk(y,m,d){if(!(y>1990&&m>=1&&m<=12&&d>=1&&d<=31))return null;const dt=new Date(y,m-1,d);return dt.getMonth()===m-1?iso(dt):null}
function cleanDateText(v){return norm(v).replace(/\b(lunes|martes|miercoles|jueves|viernes|sabado|domingo|monday|tuesday|wednesday|thursday|friday|saturday|sunday|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|lun|mie|jue|vie|sab|dom|mon|tue|wed|thu|fri|sat|sun)\b\.?/g,' ')
  .replace(/(\d)(st|nd|rd|th|er)\b/g,'$1').replace(/(\d)[º°ª]/g,'$1').replace(/,/g,' ').replace(/\s+/g,' ').trim()}
function parseOne(v,ctx){
  if(v==null||v==='')return null;
  if(typeof v==='number'){if(v>20000&&v<80000){const dt=new Date(Math.round((v-25569)*864e5));return mk(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate())}
    if(Number.isInteger(v)&&v>=1&&v<=31&&ctx.month)return mk(yearFor(ctx.month,ctx),ctx.month,v);return null}
  if(v instanceof Date)return iso(v);

  if(m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/)){let y=m[3]?+m[3]:null;if(y!=null&&y<100)y+=2000;const mo=+m[2];return mk(y??yearFor(mo,ctx),mo,+m[1])}

function parseRange(v,ctx){

  if(m){const mo=monthOf(m[3]);if(mo){const y=m[4]?+m[4]:yearFor(mo,ctx);const a=mk(y,mo,+m[1]),b=mk(y,mo,+m[2]);if(a&&b)return [a,b<a?a:b]}}

function guessKind(kindTxt,title,def){
  const k=norm(kindTxt),t=norm(title);
  const nol=/no lectiv|vacacion|festivo|puente|holiday|half.?term|conge|vacances|ferie|sin clase|bank/;
  const fest=/festividad|celebraci|dia de|dia del|dia mundial|dia internacional|world |international|journee|navidad|christmas|noel|semana santa|easter|paques|todos los santos|all saints|toussaint|hispanidad|constitucion|inmaculada|san |santa |virgen|saint/;
  const camp=/campan|campaign|campagne/;
  const act=/activ|evento|event|excursi|salida|reuni|meeting|sortie|jornada|open day|graduaci|festival|concierto|torneo|competici/;
  if(k){if(nol.test(k))return 'nolectivo';if(camp.test(k))return 'campaña';if(/fest|celebr/.test(k))return 'festividad';if(act.test(k))return 'actividad'}

function detectCols(rows){

  for(let r=0;r<Math.min(rows.length,20);r++){const row=(rows[r]||[]).map(v=>norm(v).trim());const m={start:-1,end:-1,title:-1,kind:-1,notes:-1};
    row.forEach((v,i)=>{if(!v||v.length>40)return;
      if(m.end<0&&/(fecha fin|fin$|^fin\b|\bend\b|hasta|termina|^al$|^to$)/.test(v))m.end=i;
      else if(m.start<0&&/(fecha|date|^dia$|^jour|inicio|start|desde|^del$|^from$|cuando|when)/.test(v))m.start=i;
      else if(m.title<0&&/(evento|event|titulo|title|actividad|celebraci|festividad|descripci|nombre|activit|concepto|asunto|motivo|^que)/.test(v))m.title=i;
      else if(m.kind<0&&/(tipo|type|categor|clase)/.test(v))m.kind=i;
      else if(m.notes<0&&/(nota|observ|coment|detalle|lugar|notes|curso|etapa|responsable|hora)/.test(v))m.notes=i});
    if(m.start>=0&&m.title>=0){header=r;Object.assign(map,m);break}}
  if(header<0){const sample=rows.slice(0,200);const ncol=Math.max(0,...sample.map(r=>(r||[]).length));const ds=[],tx=[];
    for(let c=0;c<ncol;c++){let a=0,b=0;sample.forEach(r=>{const v=(r||[])[c];if(v===''||v==null)return;if(parseRange(v,{startY:2026,month:null}))a++;else if(typeof v==='string'&&v.trim().length>2)b++});ds[c]=a;tx[c]=b}
    const best=xs=>xs.reduce((bi,v,i)=>v>(xs[bi]??-1)?i:bi,0);
    map.start=ncol?best(ds):-1;const tx2=tx.map((v,i)=>i===map.start?-1:v);map.title=ncol>1?best(tx2):-1}
  return {header,map}}
function schoolYears(){const d=new Date();const y=d.getMonth()>=7?d.getFullYear():d.getFullYear()-1;return [y-1,y,y+1].map(a=>`${a}-${String(a+1).slice(2)}`)}
function impRows(){
  const I=drawer.imp;if(!I)return [];const d=drawer.draft;const rows=I.sheets[I.sheet]||[];const out=[];const startY=+String(d.course).slice(0,4);let month=null;
  for(let r=I.header+1;r<rows.length;r++){const row=rows[r]||[];const filled=row.filter(v=>v!==''&&v!=null);if(!filled.length)continue;
    if(filled.length===1&&typeof filled[0]==='string'&&filled[0].trim().split(/\s+/).length<=3){const w=cleanDateText(filled[0]).split(' ');const mo=w.map(monthOf).find(Boolean);if(mo&&!parseRange(filled[0],{startY,month:null})){month=mo;continue}}
    const ctx={startY,month};const g=i=>i>=0?row[i]:'';
    const st=parseRange(g(I.map.start),ctx);const title=String(g(I.map.title)??'').replace(/\s+/g,' ').trim();
    if(!st&&!title)continue;

    const start=st?st[0]:'';let end=en?(en[1]||en[0]):(st?st[1]:'');if(end&&start&&end<start)end=start;
    const kind=I.kinds[r]||guessKind(I.map.kind>=0?String(g(I.map.kind)):'',title,d.kind);
    const notes=I.map.notes>=0?String(g(I.map.notes)??'').trim():'';
    const dup=!!start&&arr(S.events).some(e=>e.start===start&&norm(e.title).trim()===norm(title)&&(!(d.schools||[]).length||(e.schools||[]).some(s=>d.schools.includes(s))));

function loadXLSX(){if(window.XLSX)return Promise.resolve(window.XLSX);if(xlsxP)return xlsxP;
  xlsxP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>res(window.XLSX);sc.onerror=()=>{xlsxP=null;rej(new Error('load'))};document.head.appendChild(sc)});return xlsxP}
async function handleImportFile(file){

  try{const X=await loadXLSX();const buf=await file.arrayBuffer();let wb;
    if(/\.csv$/i.test(file.name)){let txt=new TextDecoder('utf-8').decode(buf);if(txt.includes('\uFFFD'))txt=new TextDecoder('windows-1252').decode(buf);wb=X.read(txt,{type:'string',raw:true})}

    const first=wb.SheetNames.find(n=>sheets[n].length>1)||wb.SheetNames[0];
    readForm();drawer.imp={name:file.name,sheets,names:wb.SheetNames,sheet:first,sel:{},kinds:{},...detectCols(sheets[first])};repaint();
  }catch(e){toast(e&&e.message==='load'?'No se pudo cargar el lector de Excel. Revisa la conexión y vuelve a intentarlo.':'No se pudo leer el archivo. Prueba a guardarlo como .xlsx o .csv');if(drop)drop.querySelector('b').textContent='Sube el Excel o CSV del calendario del colegio'}

const crqKey=()=>'x_'+Math.random().toString(36).slice(2,8);

function crqSetType(t){const q=crqState();q.tipo=t;q.on.s_grabar=t==='video'?true:(t==='otro'?q.on.s_grabar:false)}
function crqCreate(){
  const q=crqState();const text=(q.text||'').trim();
  if(!text){toast('Escribe qué necesitas');const i=document.querySelector('[data-crqtext]');if(i)i.focus();return}
  const d=readForm();d.creatives=d.creatives||[];const cx=crCtx(d);
  const map={flyer:['imagen','Cartel'],post:['imagen','Post'],video:['video',''],email:['mailing','Email'],otro:['otro','']};const [fam,format]=map[q.tipo]||['otro',''];
  const cr={id:crId(),fam,format,qty:1,channels:[],spec:{...(FMT[format]?.def||{})},brief:'',material:'',link:'',files:[],owner:d.owner||'',due:cx.date?addDays(cx.date,-3):'',subs:{},title:text};
  CRQ_SUBS.forEach(([k])=>{if(q.on[k])cr.subs[k]=subDefault(k,cx,cr.owner)});
  q.extra.forEach(x=>{if(x.on){const k=crqKey();cr.subs[k]={on:true,who:cr.owner,due:cx.date?addDays(cx.date,-3):'',label:x.label};NMAP[k]={id:k,label:x.label,off:-3}}});
  d.creatives.push(cr);const n=Object.keys(cr.subs).length;

    <div style="display:flex;flex-wrap:wrap;gap:6px 14px">${schools.map(s=>`<label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" data-accsch="${s.id}" ${schools.length===1?'checked':''}> ${esc(s.short||s.name)}</label>`).join('')||'<span class="help">No hay colegios todavía.</span>'}</div>
    <div style="margin-top:12px"><button class="btn primary" data-acc="invite" type="button">Invitar</button></div></div>`;
  const sent=ACC.sent.length?`<div class="card"><h3 style="margin:0 0 6px">Invitaciones de esta sesión</h3>${ACC.sent.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`:'';
  let lists='';
  if(sup){
    const inv=(ACC.invites||[]).sort((a,b)=>a.email.localeCompare(b.email)),us=(ACC.users||[]).sort((a,b)=>(a.email||'').localeCompare(b.email||''));
    lists=`<div class="card"><h3 style="margin:0 0 6px">Invitaciones pendientes</h3>${ACC.invites===null?'<div class="help">Cargando…</div>':inv.length?inv.map(i=>`<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)"><span><b>${esc(i.email)}</b> · ${esc(rl(i.rol))}${(i.schools||[]).length?' · '+esc(i.schools.map(accName).join(', ')):''}</span><button class="btn sm" data-acc="delinv" data-k="${esc(i.email)}" type="button">Quitar</button></div>`).join(''):'<div class="help">No hay invitaciones pendientes.</div>'}</div>
    <div class="card"><h3 style="margin:0 0 6px">Personas con acceso</h3>${ACC.users===null?'<div class="help">Cargando…</div>':us.length?us.map(u=>`<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)"><span><b>${esc(u.nombre||u.email)}</b> <span class="muted">${esc(u.email)}</span> · ${esc(rl(u.rol))}${(u.schools||[]).length?' · '+esc(u.schools.map(accName).join(', ')):''}${u.activo===false?' · <b style="color:var(--bad)">desactivada</b>':''}</span>
      <span>${u.uid===P.uid?'<span class="muted">(tú)</span>':`<button class="btn sm" data-acc="active" data-k="${u.uid}" data-v="${u.activo===false?'1':'0'}" type="button">${u.activo===false?'Reactivar':'Desactivar'}</button> <button class="btn sm" data-acc="deluser" data-k="${u.uid}" type="button">Quitar</button>`}</span></div>`).join(''):'<div class="help">Todavía no ha entrado nadie.</div>'}</div>
    <div class="card"><h3 style="margin:0 0 6px">Datos</h3>
      <div class="help" style="margin-bottom:10px"><b>Copia de seguridad:</b> descarga todo en un archivo. Guárdalo en Drive una vez al mes.<br><b>Importar:</b> carga un archivo de copia (por ejemplo, el de los datos iniciales). Lo que ya exista con el mismo identificador se sobrescribe.</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn" data-acc="export" type="button">Descargar copia de seguridad</button>
      <label class="btn" style="cursor:pointer">Importar archivo…<input id="acc-file" type="file" accept="application/json,.json" style="display:none"></label></div></div>`;
  }else lists=`<div class="help">Solo Fundación Parentes puede cambiar o desactivar accesos ya creados.</div>`;
  return `<div class="head"><div><h2>Accesos</h2><div class="sub">${sup?'Quién puede entrar en la plataforma y qué puede hacer.':'Invita a tu equipo.'}</div></div></div>
    ${ACC.msg?`<div class="banner">${esc(ACC.msg)}</div>`:''}<div style="display:grid;gap:14px">${form}${sent}${lists}</div>`;
}
async function accImport(file){
  let j;try{j=JSON.parse(await file.text())}catch(e){toast('El archivo no es un JSON válido');return}
  const cols=Store.COLS.filter(c=>j[c]&&typeof j[c]==='object');let total=0;cols.forEach(c=>{total+=Object.keys(j[c]).length});
  if(!total){toast('El archivo no tiene datos');return}
  if(!confirm('Se van a guardar '+total+' registros. Los que ya existan con el mismo identificador se sobrescriben. ¿Continuar?'))return;
  let done=0,fail=0;
  for(const c of cols){const ids=Object.keys(j[c]);
    for(let i=0;i<ids.length;i+=15){
      await Promise.all(ids.slice(i,i+15).map(id=>Store.create(c,id,j[c][id]).then(()=>{done++}).catch(e=>{fail++;console.warn('importación',c,id,e)})));
      ACC.msg='Importando… '+(done+fail)+' de '+total;render()}}
  ACC.msg='Importación terminada: '+done+' registros guardados'+(fail?', '+fail+' con error (abre la consola del navegador para verlos)':'')+'.';render();
}
async function accExport(){
  const out={};Store.COLS.forEach(c=>{out[c]=Store.list(c)});
  await Store.download({filename:'copia-plataforma-parentes-'+TODAY+'.json',data:new Blob([JSON.stringify(out,null,1)],{type:'application/json'})});toast('Copia descargada');
}
document.addEventListener('click',async e=>{
  const b=e.target&&e.target.closest&&e.target.closest('[data-acc]');if(!b||!real())return;
  const a=b.dataset.acc,F=window.PPFB;
  try{
    if(a==='invite'){
      const email=(document.getElementById('acc-email').value||'').trim().toLowerCase(),rol=document.getElementById('acc-rol').value;
      const sch=[...document.querySelectorAll('[data-accsch]:checked')].map(x=>x.dataset.accsch);
      if(!email.includes('@')){toast('Escribe el correo de la persona');return}
      if(rol!=='superadmin'&&!sch.length){toast('Marca al menos un colegio');return}
      await F.invite({email,rol,schools:rol==='superadmin'?[]:sch});
      ACC.sent.unshift(email+' · '+rol+(sch.length?' · '+sch.map(accName).join(', '):''));ACC.msg='Invitación guardada. Dile a '+email+' que entre en la plataforma con ese correo.';
      if(F.profile.rol==='superadmin')await accLoad();else render();
    }else if(a==='delinv'){await F.deleteInvite(b.dataset.k);await accLoad()}
    else if(a==='active'){await F.setUserActive(b.dataset.k,b.dataset.v==='1');await accLoad()}
    else if(a==='deluser'){if(confirm('¿Quitar a esta persona? Dejará de tener acceso.')){await F.deleteUser(b.dataset.k);await accLoad()}}
    else if(a==='export')await accExport();
  }catch(err){toast('No se pudo hacer: '+(err.code||err.message))}
});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='acc-file'&&e.target.files[0]){const f=e.target.files[0];e.target.value='';accImport(f)}});

boot();
})();
</script>
